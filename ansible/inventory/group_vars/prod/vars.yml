---
# Host-specific variables for remote deployment via SSH
# This file overrides defaults for the 192.168.178.34 host when targeted by ansible-playbook

vote_backend_container_user: vote

# For remote SSH hosts, we should NOT build the image locally on the target.
# This playbook will build the image on localhost and push it to this host.
vote_backend_build_on_target: false

vote_backend_postgres_persistent: true
vote_backend_acme_enabled: true
vote_backend_acme_method: "dns"
vote_backend_acme_dns_provider: "dns_duckdns"
vote_backend_acme_domain: "vote-backend.duckdns.org"
vote_backend_acme_dns_token: "{{ vault_acme_dns_token }}"
vote_backend_nginx_server_name: "{{ vote_backend_acme_domain }}"
vote_backend_tls_dir: "{{ ansible_facts['env']['HOME'] }}/.config/vote-backend/tls"
vote_backend_quadlet_dir: "{{ ansible_facts['env']['HOME'] }}/quadlets"

# Enable the rootless port forwarder (pasta) in containers.conf.
# Required when the backend is deployed behind an nginx reverse proxy
# so that podman can forward host ports into the rootless network.
vote_backend_nginx_enabled: true

# --- Service boot configuration ------------------------------------------
# For production deployments on this host, we want services to start automatically at boot.
vote_backend_start_services_at_boot: true

vote_backend_app_reset_url: "https://reset.vote4it.org"

vote_backend_allowed_origin: "https://reset.yourdomain.com"
