---
# app role
# Manages the vote-backend application container.
# - Creates the vote-backend config directory
# - Generates and secures the JWT secret key (idempotent)
# - Renders config.json from vaulted DB credentials and the secret key
# - Renders the vote-backend@{{ tag }} quadlet
#
# Service restart is handled by the systemd role (which runs after this role).

- name: Ensure vote-backend config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/vote-backend"
    state: directory
    mode: "0755"

- name: Render config.json to user config directory
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/vote-backend/config.json"
    mode: "0600"
  no_log: true

- name: Render vote-backend quadlet (publish port only without nginx)
  ansible.builtin.template:
    src: "vote-backend@.container.j2"
    dest: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config') }}/containers/systemd/vote-backend@.container"
    mode: "0644"
