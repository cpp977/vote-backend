---
# roles/deploy-local/tasks/main.yml
# Local deployment role for vote-backend.
# Builds the container image, installs quadlets, and starts
# rootless Podman systemd services for the app and database.

- name: Ensure vote-backend config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/vote-backend"
    state: directory
    mode: "0755"

# The following tasks build the image and copy repo artifacts onto the target.
# They run only when vote_backend_build_on_target is true (the default). A
# remote SSH host that does not have the repo checked out should set this to
# false and instead use a prebuilt/pulled image (see vote_backend_image_name /
# vote_backend_image_tag) plus its own config.json and sql sources.

- name: Ensure secret exists on remote host (idempotent, generated remotely)
  ansible.builtin.shell: openssl rand -hex 32 > ~/.config/vote-backend/secret_key
  args:
    creates: ~/.config/vote-backend/secret_key

- name: Lock down secret file permissions
  ansible.builtin.file:
    path: ~/.config/vote-backend/secret_key
    mode: '0600'

- name: Read the secret back for use in the config template
  ansible.builtin.slurp:
    src: ~/.config/vote-backend/secret_key
  register: vote_backend_secret_key_raw

- name: Set fact for templating
  ansible.builtin.set_fact:
    vote_backend_secret_key: "{{ vote_backend_secret_key_raw.content | b64decode | trim }}"

- name: Render config.json to user config directory
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/vote-backend/config.json"
    mode: "0644"

- name: Copy SQL init scripts to a portable location
  ansible.builtin.copy:
    src: "{{ vote_backend_project_root }}/sql/"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/share/vote-backend/sql/"
    mode: "0644"
    directory_mode: "0755"
  when: vote_backend_build_on_target | default(true)

- name: Build vote-backend container image
  containers.podman.podman_image:
    name: "{{ vote_backend_image_name }}"
    tag: "{{ vote_backend_image_tag }}"
    state: build
    path: "{{ vote_backend_project_root }}"
    build:
      file: "{{ vote_backend_project_root }}/Containerfile"
      force_rm: true
  register: image_build
  when: vote_backend_build_on_target | default(true)

- name: Install vote.network quadlet
  containers.podman.podman_quadlet:
    state: present
    src: "{{ vote_backend_quadlet_dir }}/vote.network"

# NOTE: The PostgreSQL data directory is intentionally NOT pre-created by
# Ansible. After the container starts, PostgreSQL chowns the bind-mounted
# directory to its in-namespace UID with mode 0700; the host user can then no
# longer access it, which would cause a "permission denied" error on a later
# run when Ansible stats/creates the path. Podman creates the bind-mount source
# directory automatically when the container starts, so we rely on that instead
# of managing the directory from the playbook (use `podman unshare` to fix an
# already-chowned directory manually).

- name: Render drogon-postgres quadlet (ephemeral or persistent)
  ansible.builtin.template:
    src: drogon-postgres.container.j2
    dest: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config') }}/containers/systemd/drogon-postgres.container"
    mode: "0644"

- name: Render vote-backend quadlet (publish port only without nginx)
  ansible.builtin.template:
    src: "vote-backend@.container.j2"
    dest: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config') }}/containers/systemd/vote-backend@.container"
    mode: "0644"

- name: Ensure containers.conf disables netavark firewall (nftables incompatibility)
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/containers/containers.conf"
    content: |
      [network]
      firewall_driver = "none"
      {% if vote_backend_nginx_enabled | default(false) %}
      rootless_port_forwarder = "pasta"
      {% endif %}
    mode: "0644"

# --- Persistent deployment: TLS + nginx reverse proxy (HTTPS) ----------------
- name: Ensure TLS directory exists (persistent deployment)
  ansible.builtin.file:
    path: "{{ vote_backend_tls_dir }}"
    state: directory
    mode: "0700"
  when: vote_backend_postgres_persistent | default(false)

# Self-signed certificate generation is used only when acme.sh certificate
# issuance is NOT enabled. When vote_backend_acme_enabled is true the acme.yml
# task file below obtains a Let's Encrypt certificate instead and deploys it
# into the same vote_backend_tls_dir directory.
- name: Generate TLS private key (self-signed, persistent deployment)
  ansible.builtin.command:
    cmd: "openssl genrsa -out {{ vote_backend_tls_dir }}/privkey.pem 2048"
    creates: "{{ vote_backend_tls_dir }}/privkey.pem"
  when:
    - vote_backend_postgres_persistent | default(false)
    - not (vote_backend_acme_enabled | default(false))

- name: Generate self-signed TLS certificate (persistent deployment)
  ansible.builtin.command:
    cmd: >-
      openssl req -new -x509 -days 365
      -key {{ vote_backend_tls_dir }}/privkey.pem
      -out {{ vote_backend_tls_dir }}/fullchain.pem
      -subj "/CN={{ vote_backend_nginx_server_name }}"
      -addext "subjectAltName=DNS:{{ vote_backend_nginx_server_name }},IP:127.0.0.1"
    creates: "{{ vote_backend_tls_dir }}/fullchain.pem"
  when:
    - vote_backend_postgres_persistent | default(false)
    - not (vote_backend_acme_enabled | default(false))

- name: Restrict TLS private key permissions (persistent deployment)
  ansible.builtin.file:
    path: "{{ vote_backend_tls_dir }}/privkey.pem"
    mode: "0600"
  when:
    - vote_backend_postgres_persistent | default(false)
    - not (vote_backend_acme_enabled | default(false))

# Obtain a Let's Encrypt certificate via acme.sh (http-01, standalone on port
# 80, run rootful on the host) and deploy it into vote_backend_tls_dir. Skipped
# unless vote_backend_acme_enabled is true.
- name: Include acme.sh certificate issuance tasks
  ansible.builtin.import_tasks: acme.yml
  when:
    - vote_backend_postgres_persistent | default(false)
    - vote_backend_acme_enabled | default(false)

- name: Render nginx reverse-proxy configuration (persistent deployment)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ vote_backend_nginx_conf }}"
    mode: "0644"
  when: vote_backend_postgres_persistent | default(false)

- name: Copy nginx main config
  ansible.builtin.copy:
    src: "{{ vote_backend_project_root }}/ansible/roles/deploy-local/files/nginx.conf"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/vote-backend/nginx.conf"
    mode: "0644"

- name: Install vote-backend-nginx quadlet (persistent deployment)
  ansible.builtin.template:
    src: "vote-backend-nginx@.container.j2"
    dest: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config') }}/containers/systemd/vote-backend-nginx@.container"
    mode: "0644"
  when: vote_backend_postgres_persistent | default(false)

- name: Reload systemd user daemon to pick up new quadlets
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vote_backend_uid }}"

# Restart (not merely start) the services so their containers are recreated
# from the *current* quadlet. `systemctl start` is a no-op for an already
# running container, which would otherwise leave a stale container behind
# (e.g. the wrong port exposure or data-dir mapping) when switching between
# the persistent (nginx) and ephemeral (test) deployments. The podman quadlet
# units use `podman run --replace`, so a restart reliably recreates the
# container with the latest quadlet configuration.
- name: Restart drogon-postgres service
  ansible.builtin.systemd_service:
    name: drogon-postgres.service
    state: restarted
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vote_backend_uid }}"

- name: Restart vote-backend service (template instance)
  ansible.builtin.systemd_service:
    name: "vote-backend@{{ vote_backend_image_tag }}.service"
    state: restarted
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vote_backend_uid }}"

- name: Restart vote-backend-nginx reverse proxy (persistent deployment)
  ansible.builtin.systemd_service:
    name: "vote-backend-nginx@{{ vote_backend_image_tag }}.service"
    state: restarted
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vote_backend_uid }}"
  when: vote_backend_postgres_persistent | default(false)

# If a previous persistent deployment left an nginx reverse proxy running,
# tear it down when deploying the ephemeral (test) setup.
- name: Stop and disable vote-backend-nginx reverse proxy (ephemeral deployment)
  ansible.builtin.systemd_service:
    name: "vote-backend-nginx@{{ vote_backend_image_tag }}.service"
    state: stopped
    enabled: false
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ vote_backend_uid }}"
  failed_when: false
  when: "not (vote_backend_postgres_persistent | default(false))"

- name: Remove vote-backend-nginx quadlet (ephemeral deployment)
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['XDG_CONFIG_HOME'] | default(ansible_facts['env']['HOME'] ~ '/.config') }}/containers/systemd/vote-backend-nginx@.container"
    state: absent
  when: "not (vote_backend_postgres_persistent | default(false))"
